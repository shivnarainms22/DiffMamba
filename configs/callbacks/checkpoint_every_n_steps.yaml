checkpoint_every_n_steps:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  # Disk-safe: keep last.ckpt (always) + the 3 most-recent step-based ckpts.
  # At ~500MB per dimamba-130M ckpt, this stays under 2GB. RunPod default
  # volume is 50–100GB. Save_top_k=-1 would fill the disk and crash the run.
  save_top_k: 3
  save_last: True
  monitor: step
  mode: max
  dirpath: ${checkpointing.save_dir}/checkpoints
  verbose: True
  auto_insert_metric_name: False
  # 2000 steps × 64 batch × 1024 seq ≈ 130M tokens between ckpts.
  every_n_train_steps: 2000
  filename: 'step={step}'
