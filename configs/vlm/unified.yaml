# @package _global_
#
# Unified (understand + generate) config group. Janus-style decoupled: SigLIP
# prefix for understanding, expanded VQ vocab for generation, one Mamba backbone.
# Note the TWO image-token counts: SigLIP=196 (understanding), VQ=1024 (generation).
vlm:
  # vision (understanding pathway)
  encoder_name: google/siglip-base-patch16-224
  vision_dim: 768
  siglip_tokens: 196
  projector_hidden: 2048

  # VQ (generation pathway)
  vq_repo: microsoft/vq-diffusion-ithq
  vq_subfolder: vqvae
  codebook_size: 4096
  vq_tokens: 1024
  boi_id: 50258
  eoi_id: 50259
  image_base: 50260
  # Used by the generation stream for CFG-capable unified checkpoints.
  caption_dropout_prob: 0.0

  # shared text
  caption_prompt: "Describe the image."
  caption_len: 64

  # stream weights (per-step summed loss). text off by default — captioning
  # already exercises text generation; enable for a pure-text safeguard.
  understand_weight: 1.0
  generate_weight: 1.0
  text_weight: 0.0

  # grounding retrain (off by default; uni_grounding.yaml turns them on)
  proj_scale_match: false   # RMSNorm the projector output to the text-embed scale
  contrastive_weight: 0.0   # weight of the in-batch image-contrastive loss
  num_neg: 1                # negatives per example for the contrastive loss

  # CC3M, used BOTH directions (match max_examples to gen_stage2 to reuse its VQ cache)
  dataset: pixparse/cc3m-wds
  split: train
  image_column: jpg
  caption_column: txt
  streaming: true
  max_examples: 80000

  # Optional VQA eval view for `mode=uni_vqa_eval`; kept separate from the
  # CC3M training stream so unified training remains unchanged.
  vqa_dataset: lmms-lab/VQAv2
  vqa_split: validation
  vqa_image_column: image
  vqa_caption_column: multiple_choice_answer
  vqa_question_column: question
  vqa_max_examples: 40000
  vqa_text_len: 64

  # warm-start the text rows from the DiffMamba text backbone
  warmstart_path: /scratch/sarin.s/DiffMamba/runs/runD_lr1e3/checkpoints/best.ckpt
  # warm-start the projector from the trained Stage-1 (vlm_sft) projector so the
  # backbone never learns to ignore a random image prefix (avoids the collapse)
  projector_warmstart_path: /scratch/sarin.s/DiffMamba/runs/vlm_sft/checkpoints/best.ckpt
