# @package _global_
#
# Hybrid Mamba+attention 130M-class experiment. Sparse attention is inserted
# every fourth block to test whether attention recovers quality while retaining
# better long-context scaling than a full DiT denoiser.

defaults:
  - override /model: small-hybrid-dimamba
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sigterm_save]

backbone: hybrid_dimamba
parameterization: subs
mode: train

trainer:
  max_steps: 76_000
  val_check_interval: 5000
  gradient_clip_val: 1.0
  precision: 'bf16-mixed'

loader:
  global_batch_size: 64
  batch_size: 8

optim:
  lr: 3e-4
  weight_decay: 0.01

wandb:
  name: hybrid_130m

callbacks:
  hf_hub_uploader:
    _target_: hf_hub_callback.HFHubUploadCallback
    repo_id: ${oc.env:HF_HUB_REPO_ID,null}
    every_n_train_steps: 5000
    path_in_repo: hybrid_130m_seed${seed}
