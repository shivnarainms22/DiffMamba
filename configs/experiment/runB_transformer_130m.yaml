# @package _global_
#
# Run B — Transformer-MDLM 130M baseline. Matched compute, matched data.
# Used as the quality anchor for run D.

defaults:
  - override /model: small  # the DiT small config (~130M params)
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sigterm_save]

backbone: dit
parameterization: subs
mode: train

trainer:
  max_steps: 76_000
  val_check_interval: 5000
  gradient_clip_val: 1.0
  precision: 'bf16-mixed'

loader:
  global_batch_size: 64

optim:
  lr: 3e-4
  weight_decay: 0.01

callbacks:
  hf_hub_uploader:
    _target_: hf_hub_callback.HFHubUploadCallback
    repo_id: ${oc.env:HF_HUB_REPO_ID,null}
    every_n_train_steps: 5000
    path_in_repo: runB_transformer_130m
