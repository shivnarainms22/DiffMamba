# @package _global_
#
# Scaling study — BiMamba-MDLM 100M. Same 40:1 ratio → 4B tokens.
# Steps: ceil(4B / (64 * 1024)) = 61035 → round to 61000.

defaults:
  - override /model: base-dimamba
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sigterm_save]

backbone: dimamba
parameterization: subs
mode: train

trainer:
  max_steps: 61_000
  val_check_interval: 5000
  precision: 'bf16-mixed'

loader:
  global_batch_size: 64

optim:
  lr: 3e-4
  weight_decay: 0.01

callbacks:
  hf_hub_uploader:
    _target_: hf_hub_callback.HFHubUploadCallback
    repo_id: ${oc.env:HF_HUB_REPO_ID,null}
    every_n_train_steps: 5000
    path_in_repo: scaling_100m
