# @package _global_
#
# VLM Stage 2 — text->image generation. Vocab-expanded BiMamba MDLM (text rows
# warm-started from runD_lr1e3) trained on CC3M caption->VQ-token sequences.
#
# Usage (GPU node): python main_vlm.py +experiment=gen_stage2

defaults:
  - /vlm: vqgen
  - override /model: small-dimamba
  - override /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor, sigterm_save]

backbone: dimamba
parameterization: subs
mode: gen_train

data:
  cache_dir: /scratch/sarin.s/data

checkpointing:
  save_dir: /scratch/sarin.s/DiffMamba/runs/gen_stage2

# 8000 is a multiple of the 2000-step checkpoint interval.
trainer:
  max_steps: 8000
  val_check_interval: 2000
  gradient_clip_val: 1.0
  precision: 'bf16-mixed'

loader:
  # Sequence is ~1059 tokens (caption 32 + 1024 image + markers); use a smaller
  # micro-batch and let accumulation rebuild the global batch.
  global_batch_size: 64
  batch_size: 8

optim:
  lr: 3e-4
  weight_decay: 0.01

wandb:
  name: gen_stage2
