# @package _global_
#
# Grounding retrain (Stage 3.6): make the unified model answer VQA USING the
# image. Inherits uni_vqa_sft's proven data path (VQAv2 labeled pool, held-out
# tail eval, CC3M generation). Adds: projector scale-match + in-batch image
# contrastive loss, and up-weights the understanding stream. Warm-starts ALL
# weights from the uni_vqa_sft checkpoint.
#
# Usage (GPU node): python main_vlm.py +experiment=uni_grounding
#
# Spec: docs/superpowers/specs/2026-06-11-grounding-retrain-design.md

defaults:
  - uni_vqa_sft

vlm:
  proj_scale_match: true   # FROZEN at text-std in UnifiedDiffusion (no shrink escape)
  # attempt 2: contrastive is now the dominant signal (was 0.5 vs understand 2.0 ->
  # outgunned 4:1 and the model escaped via the learnable scale). Scale now frozen,
  # so contrastive can actually force image-discriminative answers.
  contrastive_weight: 2.0
  num_neg: 2               # 3-way discrimination -> cleaner grounding gradient
  understand_weight: 1.0
  unified_warmstart_path: /scratch/sarin.s/DiffMamba/runs/uni_vqa_sft/checkpoints/best.ckpt

checkpointing:
  # fresh dir: runs/uni_grounding holds attempt 1's collapsed ckpt; reusing it would
  # make the self-chain RESUME that instead of warm-starting clean from uni_vqa_sft.
  save_dir: /scratch/sarin.s/DiffMamba/runs/uni_grounding_v2

trainer:
  max_steps: 8000

optim:
  lr: 2e-4

wandb:
  name: uni_grounding_v2
